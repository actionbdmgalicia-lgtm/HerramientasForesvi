<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="eyebrow">⟁ Planificación Fiscal Empresarial · España 2024–2025</div>
    <h1>Simulador <span>Holding & IS</span></h1>
    <p>Compara tres estructuras: SL aislada, holding con exención art. 21 LIS y consolidación fiscal. Incluye simulación de plusvalía en venta de sociedad, el escenario donde el holding genera el mayor ahorro fiscal.</p>
  </div>
</header>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── TAX UTILS ─────────────────────────────── */
const IS = { general:0.25, micropyme:0.23, nueva:0.15 };
const IRPF = [
  {max:6000,   rate:.19},
  {max:50000,  rate:.21},
  {max:200000, rate:.23},
  {max:300000, rate:.27},
  {max:Infinity,rate:.28},
];

function irpf(amount) {
  let tax=0, rem=Math.max(0,amount), prev=0;
  for(const {max,rate} of IRPF){ if(rem<=0)break; const s=Math.min(rem,max-prev); tax+=s*rate; rem-=s; prev=max; }
  return tax;
}
function irpfDetail(amount) {
  const t=[]; let rem=Math.max(0,amount), prev=0;
  for(const {max,rate} of IRPF){ if(rem<=0)break; const s=Math.min(rem,max-prev); if(s>0)t.push({from:prev,to:Math.min(max,amount),rate,base:s,tax:s*rate}); rem-=s; prev=max; }
  return t;
}
const isRate = t => IS[t]??0.25;
const fmt = (n,d=0) => isNaN(n)||n===null?'—': new Intl.NumberFormat('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)+' €';
const fmtPct = (n,d=1) => isNaN(n)?'—':(n*100).toFixed(d)+' %';

/* ─── SCENARIOS ─────────────────────────────── */
function calcA(cos, wr) { // SL aislada
  const rs = cos.map(c=>{
    const bai=c.profit, bu=Math.min(Math.max(0,c.bins),Math.max(0,bai)),
          bi=Math.max(0,bai-bu), is=bi*isRate(c.isType), bdi=bai-is;
    return{...c,bai,binsUsed:bu,bi,is,bdi};
  });
  const totalIS=rs.reduce((s,r)=>s+r.is,0), totalBDI=rs.reduce((s,r)=>s+r.bdi,0);
  const w=Math.max(0,totalBDI)*wr, tax=irpf(w), ret=Math.max(0,totalBDI)-w;
  const gp=rs.reduce((s,r)=>s+Math.max(0,r.bai),0);
  return{cos:rs,totalIS,totalBDI,w,irpf:tax,ret,totalTax:totalIS+tax,er:gp>0?(totalIS+tax)/gp:0,gp,irpfD:irpfDetail(w)};
}

function calcB(cos, wr, art21) { // Holding
  const rs = cos.map(c=>{
    const bai=c.profit, bu=Math.min(Math.max(0,c.bins),Math.max(0,bai)),
          bi=Math.max(0,bai-bu), is=bi*isRate(c.isType), bdi=bai-is;
    return{...c,bai,binsUsed:bu,bi,is,bdi};
  });
  const totalISop=rs.reduce((s,r)=>s+r.is,0), totalBDIop=rs.reduce((s,r)=>s+r.bdi,0);
  const divH=Math.max(0,totalBDIop);
  const exPct=art21?0.95:0, hBase=divH*(1-exPct), hIS=hBase*0.25, hNet=divH-hIS;
  const hEfRate=divH>0?hIS/divH:0;
  const w=hNet*wr, tax=irpf(w), ret=hNet-w;
  const gp=rs.reduce((s,r)=>s+Math.max(0,r.bai),0);
  const tt=totalISop+hIS+tax;
  return{cos:rs,totalISop,totalBDIop,divH,hBase,hIS,hNet,hEfRate,w,irpf:tax,ret,totalTax:tt,er:gp>0?tt/gp:0,gp,irpfD:irpfDetail(w),art21sav:art21?divH*.95*.25:0};
}

function calcC(cos, wr) { // Consolidación
  const rs = cos.map(c=>{
    const bai=c.profit, bu=Math.min(Math.max(0,c.bins),Math.max(0,bai)), bi=bai-bu;
    return{...c,bai,binsUsed:bu,bi};
  });
  const gBase=rs.reduce((s,r)=>s+r.bi,0), gIS=Math.max(0,gBase)*0.25;
  const totalP=rs.reduce((s,r)=>s+r.bai,0), totalBDI=totalP-gIS;
  const w=Math.max(0,totalBDI)*wr, tax=irpf(w), ret=Math.max(0,totalBDI)-w;
  const gp=rs.reduce((s,r)=>s+Math.max(0,r.bai),0);
  const loff=rs.reduce((s,r)=>s+(r.bi<0?Math.abs(r.bi):0),0);
  return{cos:rs,gBase,gIS,totalBDI,w,irpf:tax,ret,totalTax:gIS+tax,er:gp>0?(gIS+tax)/gp:0,gp,irpfD:irpfDetail(w),loff};
}

/* ─── CAPITAL GAINS CALC ────────────────────── */
function calcPlusv(salePrice, costBase, art21) {
  const gain = Math.max(0, salePrice - costBase);
  // Person sells directly: IRPF on gain
  const taxDirect = irpf(gain);
  const netDirect = gain - taxDirect;
  // Holding sells: art. 21 → 95% exempt, IS on 5%
  const holdingBase = art21 ? gain * 0.05 : gain;
  const holdingIS = holdingBase * 0.25;
  const netHolding = gain - holdingIS;
  const savings = taxDirect - holdingIS;
  return { gain, taxDirect, netDirect, holdingBase, holdingIS, netHolding, savings, detailD: irpfDetail(gain) };
}

/* ─── INSIGHTS ───────────────────────────────── */
function Insights({rA,rB,rC,wr,art21}) {
  const diffH=rA.totalTax-rB.totalTax; // negative = holding costs more annually
  const diffC=rA.totalTax-rC.totalTax;
  const retDiff=rB.ret-rA.ret;
  const ins=[];

  // Annual comparison context
  if(diffH<0 && art21) {
    ins.push({ico:'ℹ️',bg:'var(--ambbg)',txt:<>
      <strong>En el ciclo anual ordinario, el holding añade un coste pequeño.</strong> La holding paga IS adicional (~1,25%) sobre los dividendos que recibe de las operativas, incluso con art. 21. Con los datos actuales, esto supone {fmt(Math.abs(diffH))} más al año vs tener las SLs directamente. <strong>El gran ahorro del holding está en la venta de participaciones</strong> (ver simulación abajo) y en la flexibilidad de reinversión cruzada.
    </>});
  } else if(diffH>0 && art21) {
    ins.push({ico:'✅',bg:'var(--grnbg)',txt:<>
      <strong>El holding ahorra {fmt(diffH)} este año.</strong> Gracias al art. 21 LIS, la holding paga solo ~1,25% efectivo sobre los dividendos recibidos. Esto supera el coste adicional del nivel holding y resulta en menor carga total.
    </>});
  }

  if(!art21) {
    ins.push({ico:'⚠️',bg:'var(--ambbg)',txt:<>
      <strong>Art. 21 LIS desactivado.</strong> Sin la exención, la holding tributa al 25% sobre todos los dividendos recibidos, sumando una capa adicional de IS innecesaria. Activa la exención si la holding cumple: participación ≥5%, período ≥1 año y la filial no es principalmente patrimonial sin actividad económica real.
    </>});
  }

  // Capital gains key message
  ins.push({ico:'💰',bg:'var(--viobg)',txt:<>
    <strong>La ventaja fiscal real del holding: venta de participaciones.</strong> Cuando la holding (no el socio directamente) vende una filial con art. 21, la plusvalía tributa al ~1,25% efectivo. Si la venta directa por el socio supusiera una plusvalía de 1.000.000 €, el IRPF sería ~230.000 €. La holding pagaría solo ~12.500 €. Ahorro: ~217.500 €. Usa el simulador de plusvalía para calcular tu escenario concreto.
  </>});

  // Cross-investment flexibility
  if(rB.ret>50000) {
    ins.push({ico:'🔄',bg:'var(--bluebg)',txt:<>
      <strong>Flexibilidad de reinversión cruzada.</strong> Los {fmt(rB.ret)} retenidos en holding pueden invertirse en nuevas filiales, comprar inmuebles o activos financieros <em>sin pasar por caja de IRPF personal</em>. La misma cantidad extraída y reinvertida por el socio habría pagado {fmt(irpf(rB.ret))} de IRPF antes de llegar a su destino.
    </>});
  }

  // Consolidation benefit
  if(diffC>100 && rC.loff>0) {
    ins.push({ico:'⚖️',bg:'var(--bluebg)',txt:<>
      <strong>Consolidación fiscal: ahorra {fmt(diffC)} al compensar {fmt(rC.loff)} de pérdidas.</strong> Las bases imponibles negativas de unas entidades del grupo compensan las positivas de otras, reduciendo la carga IS global. Útil cuando tienes nuevas sociedades en fase de pérdidas o proyectos con inversión inicial fuerte.
    </>});
  } else if(rC.loff===0) {
    ins.push({ico:'📊',bg:'var(--surf2)',txt:<>
      <strong>Consolidación fiscal: sin beneficio apreciable con todas las sociedades en beneficio.</strong> El ahorro de la consolidación surge cuando hay pérdidas que compensar entre entidades. Con el escenario actual (todas en beneficio y sin BINs relevantes), el régimen de consolidación genera IS similar al de SL aislada más el coste de la complejidad administrativa.
    </>});
  }

  if(wr>0.9) {
    ins.push({ico:'💡',bg:'var(--ambbg)',txt:<>
      <strong>Extrayendo casi todo al socio ({(wr*100).toFixed(0)}%)</strong>, la ventaja de cualquier estructura corporativa se minimiza. El mayor beneficio aparece cuando una parte relevante de los beneficios <em>se queda en la estructura</em> para diferir IRPF y reinvertir con más capital disponible.
    </>});
  }

  return(
    <div className="ins-box">
      <div className="ins-ttl">📊 Análisis comparativo</div>
      {ins.map((x,i)=>(
        <div key={i} className="ins-item">
          <div className="ins-ico" style={{background:x.bg}}>{x.ico}</div>
          <div className="ins-txt">{x.txt}</div>
        </div>
      ))}
    </div>
  );
}

/* ─── REINV PANEL ────────────────────────────── */
function ReinvPanel({rA,rB}) {
  const extra=rB.ret-rA.ret;
  if(extra<=1000) return null;
  const r=0.06;
  const grow=y=>extra*Math.pow(1+r,y);
  return(
    <div className="reinv">
      <div className="reinv-ttl">💹 Capital adicional en holding para reinvertir (base 6% anual)</div>
      <p style={{fontSize:'.78rem',color:'var(--txtd)',marginBottom:'.85rem'}}>Con holding, quedan {fmt(extra)} más en la estructura corporativa (pagaron ~1,25% IS vs lo que pagarían como IRPF personal). Proyección del capital adicional disponible compuesto:</p>
      <div className="reinv-g">
        {[1,5,10].map(y=><div key={y} className="reinv-it"><div className="reinv-v">{fmt(grow(y))}</div><div className="reinv-l">en {y} año{y>1?'s':''}</div><div style={{fontSize:'.68rem',color:'var(--txtdim)'}}>al {(r*100).toFixed(0)}% anual</div></div>)}
      </div>
      <p className="note" style={{marginTop:'.75rem'}}>Hipótesis ilustrativa. El IRPF diferido se pagará al distribuir al socio, pero el capital crece libre de IRPF adicional mientras permanece en la holding.</p>
    </div>
  );
}

/* ─── INMUEBLE PANEL ────────────────────────── */
function InmueblePanel({ art21 }) {
  const [precio, setPrecio]     = useState(400000);
  const [tipoOp, setTipoOp]     = useState('segunda');
  const [itpPct, setItpPct]     = useState(8);
  const [ajdPct, setAjdPct]     = useState(1.5);
  const [sueloPct, setSueloPct] = useState(25);
  const [alqMes, setAlqMes]     = useState(1200);
  const [gastos, setGastos]     = useState(2400);
  const [intHip, setIntHip]     = useState(0);
  const [redPct, setRedPct]     = useState(50);
  const [margPct, setMargPct]   = useState(37);
  const [isInmT, setIsInmT]     = useState('general');
  const [wrInm, setWrInm]       = useState(50);
  const [anios, setAnios]       = useState(10);
  const [aprecPct, setAprecPct] = useState(3);
  const [usufYears, setUsufY]   = useState(20);
  const [usufTit, setUsufTit]   = useState('particular');

  const IS_r    = isInmT==='micropyme' ? 0.23 : 0.25;
  const rentaA  = alqMes * 12;
  const constV  = precio * (1 - sueloPct/100);

  // Acquisition
  const notReg  = precio * 0.008;
  const impComp = tipoOp==='segunda' ? precio*itpPct/100 : precio*(10+ajdPct)/100;
  const totalInvProp = precio + impComp + notReg;

  // Usufruct (temporal: 2%/year, capped 70%)
  const pctUsuf     = Math.min(0.70, usufYears*0.02);
  const valorUsuf   = precio * pctUsuf;
  const valorNuda   = precio * (1-pctUsuf);
  const impUsuf     = tipoOp==='segunda' ? valorUsuf*itpPct/100 : valorUsuf*(10+ajdPct)/100;
  const notUsuf     = (valorUsuf/precio)*notReg;
  const totalInvUsuf = valorUsuf + impUsuf + notUsuf;

  // Amortization
  const amortP  = constV * 0.03;           // individual 3%
  const amortH  = constV * 0.02;           // holding 2%
  const amortU  = totalInvUsuf / usufYears; // usufruct: cost/years (LIRPF art.23)

  // ── Scenario A: Particular (plena propiedad) ──────
  const gDedP   = gastos + amortP + intHip;
  const rnBrP   = rentaA - gDedP;
  const biP     = Math.max(0, rnBrP) * (1-redPct/100);
  const taxP    = biP * margPct/100;
  const cashP   = rentaA - gastos - intHip - taxP;
  const yldNetP = totalInvProp>0 ? cashP/totalInvProp*100 : 0;
  const yldGrP  = totalInvProp>0 ? rentaA/totalInvProp*100 : 0;

  const valorF  = precio * Math.pow(1+aprecPct/100, anios);
  const baseP   = totalInvProp - Math.max(0, amortP*anios);
  const pvPBr   = Math.max(0, valorF-baseP);
  const pvPTax  = irpf(pvPBr);
  const pvPNet  = pvPBr - pvPTax;
  const acumP   = cashP * anios;
  const retP    = acumP + pvPNet;
  const roiP    = totalInvProp>0 ? retP/totalInvProp*100 : 0;

  // ── Scenario B: Holding (plena propiedad) ─────────
  const gDedH   = gastos + amortH + intHip;
  const rnH     = rentaA - gDedH;
  const isH     = Math.max(0, rnH) * IS_r;
  const netoH   = Math.max(0, rnH) - isH;
  const cashH   = rentaA - gastos - intHip - isH;
  const distH   = netoH * wrInm/100;
  const irpfH   = irpf(distH);
  const retHold = netoH - distH;
  const yldNetH = totalInvProp>0 ? cashH/totalInvProp*100 : 0;
  const yldGrH  = totalInvProp>0 ? rentaA/totalInvProp*100 : 0;

  const baseH   = totalInvProp - Math.max(0, amortH*anios);
  const pvHBr   = Math.max(0, valorF-baseH);
  const pvHIS   = pvHBr * IS_r;
  const pvHNet  = pvHBr - pvHIS;
  const acumH   = cashH * anios;
  const retH    = acumH + pvHNet;
  const roiH    = totalInvProp>0 ? retH/totalInvProp*100 : 0;
  const pvHDist = pvHNet * wrInm/100;
  const pvHIrpf = irpf(pvHDist);

  // ── Scenario C: Usufructo temporal ────────────────
  const isUsufH = usufTit==='holding';
  const gDedU   = gastos + amortU + intHip;
  const rnU     = rentaA - gDedU;
  let biU, taxU, cashU;
  if (!isUsufH) {
    biU   = Math.max(0, rnU) * (1-redPct/100);
    taxU  = biU * margPct/100;
    cashU = rentaA - gastos - intHip - taxU;
  } else {
    biU   = Math.max(0, rnU);
    taxU  = biU * IS_r;
    cashU = rentaA - gastos - intHip - taxU;
  }
  const yldNetU  = totalInvUsuf>0 ? cashU/totalInvUsuf*100 : 0;
  const yldGrU   = totalInvUsuf>0 ? rentaA/totalInvUsuf*100 : 0;
  const yearsRent = Math.min(anios, usufYears);
  const acumU    = cashU * yearsRent;
  const retU     = acumU; // no residual value at usufruct expiration
  const roiU     = totalInvUsuf>0 ? retU/totalInvUsuf*100 : 0;
  const usufExpBefore = usufYears < anios;

  const SH = ({t}) => <div style={{fontSize:'.74rem',fontWeight:'700',color:'var(--txtd)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'.5rem'}}>{t}</div>;

  return (
    <div style={{background:'var(--surf)',border:'1px solid var(--bord)',borderRadius:'var(--r)',padding:'1.25rem'}}>
      <div style={{fontSize:'.78rem',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--txtd)',marginBottom:'.35rem'}}>🏠 Simulación: compra de inmueble y alquiler a tercero</div>
      <div style={{fontSize:'.8rem',color:'var(--txtdim)',marginBottom:'1.25rem',lineHeight:1.5}}>
        Compara la adquisición de un inmueble residencial para alquiler bajo tres titularidades: <strong style={{color:'var(--oral)'}}>👤 Particular</strong> (plena propiedad directa), <strong style={{color:'var(--grnl)'}}>🏢 Holding</strong> (plena propiedad societaria) y <strong style={{color:'var(--vio)'}}>🏛 Usufructo temporal</strong> (solo el derecho de uso y percepción de rentas). Alquiler residencial, IVA exento en los tres casos.
      </div>

      {/* INPUTS */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem',padding:'1rem',background:'var(--surf2)',borderRadius:'8px',marginBottom:'1.25rem'}}>

        <div>
          <div style={{fontSize:'.7rem',fontWeight:'700',color:'var(--bluel)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'.6rem',paddingBottom:'.3rem',borderBottom:'1px solid var(--bord)'}}>📋 Inmueble</div>
          <div className="field"><label>Precio de compra</label><input type="number" value={precio} step="10000" min="0" onChange={e=>setPrecio(parseFloat(e.target.value)||0)}/></div>
          <div className="field">
            <label>Tipo operación</label>
            <select value={tipoOp} onChange={e=>setTipoOp(e.target.value)}>
              <option value="segunda">Segunda mano → ITP</option>
              <option value="nueva">Obra nueva → IVA 10% + AJD</option>
            </select>
          </div>
          {tipoOp==='segunda'
            ? <div className="field"><label>ITP % (CCAA, típico 6–10%)</label><input type="number" value={itpPct} step="0.5" min="0" max="20" onChange={e=>setItpPct(parseFloat(e.target.value)||0)}/></div>
            : <div className="field"><label>AJD % (CCAA, típico 0.5–2%)</label><input type="number" value={ajdPct} step="0.1" min="0" max="5" onChange={e=>setAjdPct(parseFloat(e.target.value)||0)}/></div>}
          <div className="field"><label>% suelo (no amortizable, típico 20–35%)</label><input type="number" value={sueloPct} step="5" min="0" max="80" onChange={e=>setSueloPct(parseFloat(e.target.value)||0)}/></div>
        </div>

        <div>
          <div style={{fontSize:'.7rem',fontWeight:'700',color:'var(--grnl)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'.6rem',paddingBottom:'.3rem',borderBottom:'1px solid var(--bord)'}}>🔑 Alquiler</div>
          <div className="field"><label>Alquiler mensual</label><input type="number" value={alqMes} step="50" min="0" onChange={e=>setAlqMes(parseFloat(e.target.value)||0)}/></div>
          <div className="field"><label>Gastos anuales (IBI + comunidad + seguro)</label><input type="number" value={gastos} step="100" min="0" onChange={e=>setGastos(parseFloat(e.target.value)||0)}/></div>
          <div className="field"><label>Intereses hipoteca anuales (0 = al contado)</label><input type="number" value={intHip} step="200" min="0" onChange={e=>setIntHip(parseFloat(e.target.value)||0)}/></div>
        </div>

        <div>
          <div style={{fontSize:'.7rem',fontWeight:'700',color:'var(--oral)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'.6rem',paddingBottom:'.3rem',borderBottom:'1px solid var(--bord)'}}>🧾 Fiscal</div>
          <div className="field">
            <label>Reducción IRPF (art. 23 LIRPF)</label>
            <select value={redPct} onChange={e=>setRedPct(parseFloat(e.target.value))}>
              <option value={50}>50% — general (Ley Vivienda 2023)</option>
              <option value={60}>60% — rehabilitado últimos 3 años</option>
              <option value={70}>70% — zona tensionada, arrendatario nuevo</option>
              <option value={90}>90% — zona tensionada, rebaja &gt;5%</option>
              <option value={0}>0% — local o no vivienda habitual</option>
            </select>
          </div>
          <div className="field">
            <label>Tipo marginal IRPF particular (base general)</label>
            <select value={margPct} onChange={e=>setMargPct(parseFloat(e.target.value))}>
              <option value={19}>19%</option><option value={24}>24%</option>
              <option value={30}>30%</option><option value={37}>37%</option>
              <option value={45}>45%</option><option value={47}>47%</option>

          </div>
          <div className="field">
            <label>IS holding (alquiler)</label>
            <select value={isInmT} onChange={e=>setIsInmT(e.target.value)}>
              <option value="general">General — 25%</option>
              <option value="micropyme">Micropyme — 23%</option>
            </select>
          </div>
          <div className="field"><label>% que el socio extrae del holding</label><input type="number" value={wrInm} step="10" min="0" max="100" onChange={e=>setWrInm(Math.min(100,Math.max(0,parseFloat(e.target.value)||0)))}/></div>
        </div>

        <div>
          <div style={{fontSize:'.7rem',fontWeight:'700',color:'var(--vio)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'.6rem',paddingBottom:'.3rem',borderBottom:'1px solid var(--bord)'}}>🏛 Usufructo + Proyección</div>
          <div className="field">
            <label>Duración usufructo temporal (años)</label>
            <input type="number" value={usufYears} step="5" min="1" max="50" onChange={e=>setUsufY(parseInt(e.target.value)||1)}/>
            <div style={{fontSize:'.7rem',color:'var(--vio)',marginTop:'.25rem',lineHeight:1.4}}>Valoración: {(pctUsuf*100).toFixed(0)}% → Usufructo {fmt(valorUsuf)} · Nuda propiedad {fmt(valorNuda)}</div>
          </div>
          <div className="field">
            <label>Titular del usufructo</label>
            <select value={usufTit} onChange={e=>setUsufTit(e.target.value)}>
              <option value="particular">Particular (IRPF sobre rentas)</option>
              <option value="holding">Holding (IS sobre rentas)</option>
            </select>
          </div>
          <div className="field">
            <label>Período proyección</label>
            <select value={anios} onChange={e=>setAnios(parseInt(e.target.value))}>
              {[5,10,15,20,25,30].map(y=><option key={y} value={y}>{y} años</option>)}
            </select>
          </div>
          <div className="field"><label>Revalorización anual esperada (%)</label><input type="number" value={aprecPct} step="0.5" min="-5" max="20" onChange={e=>setAprecPct(parseFloat(e.target.value)||0)}/></div>
        </div>
      </div>

      {/* SECTION 1: ACQUISITION */}
      <SH t="Costes de adquisición"/>
      <div className="tw" style={{marginBottom:'1rem'}}>
        <table>
          <thead><tr>
            <th>Concepto</th>
            <th className="nr" style={{color:'var(--oral)'}}>👤 Particular</th>
            <th className="nr" style={{color:'var(--grnl)'}}>🏢 Holding</th>
            <th className="nr" style={{color:'var(--vio)'}}>🏛 Usufructo ({(pctUsuf*100).toFixed(0)}%)</th>
          </tr></thead>
          <tbody>
            <tr><td>Precio / valor del derecho adquirido</td><td className="nr">{fmt(precio)}</td><td className="nr">{fmt(precio)}</td><td className="nr c-vio">{fmt(valorUsuf)}</td></tr>
            <tr><td>{tipoOp==='segunda'?`ITP (${itpPct}%)`:`IVA 10% + AJD ${ajdPct}%`}</td><td className="nr">{fmt(impComp)}</td><td className="nr">{fmt(impComp)}</td><td className="nr">{fmt(impUsuf)}</td></tr>
            <tr><td>Notaría + Registro (~0,8%)</td><td className="nr">{fmt(notReg)}</td><td className="nr">{fmt(notReg)}</td><td className="nr">{fmt(notUsuf)}</td></tr>
            <tr className="tr-tot">
              <td><strong>Total desembolso</strong></td>
              <td className="nr fw8 c-is">{fmt(totalInvProp)}</td>
              <td className="nr fw8 c-is">{fmt(totalInvProp)}</td>
              <td className="nr fw8 c-vio">{fmt(totalInvUsuf)}</td>
            </tr>
            <tr><td>Valor nuda propiedad (queda en otro titular)</td><td className="nr" style={{color:'var(--txtdim)'}}>—</td><td className="nr" style={{color:'var(--txtdim)'}}>—</td><td className="nr" style={{color:'var(--txtdim)'}}>{fmt(valorNuda)}</td></tr>
            <tr><td>Rentabilidad bruta sobre desembolso</td><td className="nr fw7 c-ret">{yldGrP.toFixed(2)}%</td><td className="nr fw7 c-ret">{yldGrH.toFixed(2)}%</td><td className="nr fw7 c-vio">{yldGrU.toFixed(2)}%</td></tr>

      <p className="note" style={{marginBottom:'1rem'}}>IVA de obra nueva NO deducible en alquiler residencial. En usufructo: ITP/IVA aplica solo sobre el valor del usufructo ({(pctUsuf*100).toFixed(0)}% del precio), no sobre el inmueble completo.</p>

          <thead><tr>

            <th className="nr" style={{color:'var(--oral)'}}>👤 Particular</th>
            <th className="nr" style={{color:'var(--grnl)'}}>🏢 Holding</th>

          </tr></thead>

              <td>Amortización (3%const. / 2%const. / coste÷{usufYears}a)</td>

              <td className="nr">−{fmt(amortH)}</td>
              <td className="nr c-vio">−{fmt(amortU)}</td>
            </tr>
            <tr><td>Gastos deducibles (IBI, comunidad, seguro…)</td><td className="nr">−{fmt(gastos)}</td><td className="nr">−{fmt(gastos)}</td><td className="nr">−{fmt(gastos)}</td></tr>
            {intHip>0&&<tr><td>Intereses hipoteca</td><td className="nr">−{fmt(intHip)}</td><td className="nr">−{fmt(intHip)}</td><td className="nr">−{fmt(intHip)}</td></tr>}
            <tr className="tr-tot"><td>Rendimiento neto previo</td><td className="nr">{fmt(rnBrP)}</td><td className="nr">{fmt(rnH)}</td><td className="nr">{fmt(rnU)}</td></tr>
            <tr style={{background:'rgba(249,115,22,.04)'}}>
              <td>Reducción {redPct}% art. 23 LIRPF <span className="tag t-irpf">Solo particulares</span></td>

            <tr>
              <td>Impuesto</td>

            <tr><td>Cash flow neto acumulado</td><td className="nr">{fmt(acumP)} <span style={{fontSize:'.7rem',color:'var(--txtdim)'}}>({anios}a)</span></td><td className="nr">{fmt(acumH)} <span style={{fontSize:'.7rem',color:'var(--txtdim)'}}>({anios}a)</span></td><td className="nr">{fmt(acumU)} <span style={{fontSize:'.7rem',color:'var(--txtdim)'}}>({yearsRent}a)</span></td></tr>
            <tr><td>Valor inmueble final ({aprecPct}% anual)</td><td className="nr">{fmt(valorF)}</td><td className="nr">{fmt(valorF)}</td><td className="nr" style={{color:'var(--txtdim)'}}>Revierte al nudo propietario</td></tr>
            <tr><td>Base fiscal venta (tras amortizaciones)</td><td className="nr">{fmt(baseP)}</td><td className="nr">{fmt(baseH)}</td><td className="nr" style={{color:'var(--txtdim)'}}>—</td></tr>
            <tr><td>Plusvalía imponible</td><td className="nr">{fmt(pvPBr)}</td><td className="nr">{fmt(pvHBr)}</td><td className="nr" style={{color:'var(--txtdim)'}}>Sin ganancia (extinción)</td></tr>
            <tr>
              <td>Impuesto plusvalía</td>
              <td className="nr c-irpf">−{fmt(pvPTax)} <span style={{fontSize:'.68rem',color:'var(--txtd)'}}>IRPF ahorro</span></td>
              <td className="nr c-is">−{fmt(pvHIS)} <span style={{fontSize:'.68rem',color:'var(--txtd)'}}>IS {IS_r*100}%</span></td>
              <td className="nr" style={{color:'var(--txtdim)'}}>—</td>
            </tr>
            <tr><td>Neto de venta</td><td className="nr">{fmt(pvPNet)}</td><td className="nr">{fmt(pvHNet)}</td><td className="nr" style={{color:'var(--txtdim)'}}>0 €</td></tr>
            {pvHBr>0&&wrInm>0&&<tr style={{background:'rgba(16,185,129,.04)'}}>
              <td>Socio extrae {wrInm}% venta holding → IRPF</td>
              <td className="nr" style={{color:'var(--txtdim)'}}>—</td>
              <td className="nr" style={{fontSize:'.78rem',color:'var(--txtm)'}}>{fmt(pvHDist)} → IRPF {fmt(pvHIrpf)} → neto {fmt(pvHDist-pvHIrpf)}</td>
              <td className="nr" style={{color:'var(--txtdim)'}}>—</td>
            </tr>}
            <tr className="tr-tot" style={{borderTop:'2px solid var(--bordl)'}}>
              <td><strong>Retorno total neto</strong></td>
              <td className="nr fw8" style={{color:'var(--oral)',fontSize:'1.05rem'}}>{fmt(retP)}</td>
              <td className="nr fw8" style={{color:'var(--grnl)',fontSize:'1.05rem'}}>{fmt(retH)}</td>
              <td className="nr fw8" style={{color:'var(--vio)',fontSize:'1.05rem'}}>{fmt(retU)}</td>
            </tr>
            <tr>
              <td>ROI sobre inversión inicial</td>
              <td className="nr fw7" style={{color:roiP>=0?'var(--grnl)':'var(--red)'}}>{roiP.toFixed(1)}%</td>
              <td className="nr fw7" style={{color:roiH>=0?'var(--grnl)':'var(--red)'}}>{roiH.toFixed(1)}%</td>
              <td className="nr fw7" style={{color:roiU>=0?'var(--grnl)':'var(--red)'}}>{roiU.toFixed(1)}%</td>
            </tr>
          </tbody>
        </table>
      </div>

      {/* Art. 21 / Holding note */}
      <div style={{padding:'.8rem 1rem',background:'var(--viobg)',border:'1px solid rgba(167,139,250,.25)',borderRadius:'8px',fontSize:'.8rem',color:'var(--txtm)',marginBottom:'.75rem'}}>
        <strong style={{color:'var(--vio)'}}>🏛 Claves fiscales del usufructo temporal</strong>
        <ul style={{marginTop:'.5rem',paddingLeft:'1.1rem',lineHeight:1.75,listStyle:'disc'}}>
          <li><strong>Menor desembolso inicial:</strong> Solo se paga el {(pctUsuf*100).toFixed(0)}% del valor del inmueble ({fmt(valorUsuf)}), con ITP/AJD sobre ese importe, no sobre el total.</li>
          <li><strong>Amortización del derecho:</strong> El usufructuario amortiza el coste del derecho entre los {usufYears} años ({fmt(amortU)}/año). La base amortizable NO es el valor de la construcción sino el coste de adquisición del usufructo.</li>
          <li><strong>Sin plusvalía al extinguirse:</strong> La extinción del usufructo por transcurso del plazo NO genera ganancia patrimonial para el usufructuario (no es una transmisión). El nudo propietario consolida la plena propiedad sin nuevo impuesto.</li>
          <li><strong>Mayor rentabilidad sobre capital:</strong> La menor inversión eleva el yield bruto a {yldGrU.toFixed(1)}% vs {yldGrP.toFixed(1)}% en plena propiedad. Útil para diversificar capital o como herramienta sucesoria.</li>
          <li><strong>Planificación sucesoria:</strong> Padres retienen el usufructo vitalicio (perciben rentas), hijos reciben la nuda propiedad por donación o herencia. Al fallecimiento, consolidan sin nuevo ISD (tributaron por su valor reducido). Esta estructura es independiente de si se usa o no una holding.</li>
          <li><strong>Holding + venta directa del inmueble:</strong> El art. 21 LIS NO aplica a la venta del inmueble por la holding (solo a participaciones en empresas). La plusvalía tributa a IS al {IS_r*100}%.</li>
        </ul>
      </div>

      <p className="note">Simplificaciones: proyección lineal sin reinversión de rentas. Plusvalía municipal (IIVTNU) excluida. Para IS: si la holding no tiene empleado a jornada completa, el alquiler puede considerarse actividad no económica ("sociedad patrimonial") con efectos en Patrimonio y exención empresa familiar. Gastos de agencia en venta (~3-5%) no incluidos.</p>
    </div>
  );
}

/* ─── SCENARIO SUMMARY CARD ──────────────────── */
function ScCard({lbl,ttl,cls,r,isTotal,note}) {
  const colors={a:'var(--bluel)',b:'var(--grnl)',c:'var(--vio)'};
  const rateBg={a:'var(--bluebg)',b:'var(--grnbg)',c:'var(--viobg)'};
  return(
    <div className={`sc-card ${cls}`}>
      <div className={`sc-lbl ${cls}`}>{lbl}</div>
      <div className="sc-ttl">{ttl}</div>
      <div className="sc-row"><div className="sc-rl">IS total pagado</div><div className="sc-rv c-is">{fmt(isTotal)}</div></div>
      <div className="sc-row"><div className="sc-rl">IRPF socio</div><div className="sc-rv c-irpf">{fmt(r.irpf)}</div></div>
      <div className="sc-row"><div className="sc-rl">Retenido en sociedad</div><div className="sc-rv c-ret">{fmt(r.ret)}</div></div>
      <div className="sc-sep">
        <div className="sc-tl">Carga fiscal total</div>
        <div className="sc-tv" style={{color:colors[cls]}}>{fmt(r.totalTax)}</div>
        <span className="sc-rate" style={{background:rateBg[cls],color:colors[cls]}}>Tipo ef. {fmtPct(r.er)}</span>
        {note&&<div className="sc-note">{note}</div>}
      </div>
    </div>
  );
}

/* ─── APP ────────────────────────────────────── */
let uid=1;
const DEF=[
  {id:uid++,name:'Operativa A',profit:250000,bins:0,isType:'general'},
  {id:uid++,name:'Operativa B',profit:120000,bins:0,isType:'micropyme'},
];

function App() {
  const [cos,setCos]=useState(DEF);
  const [wr,setWr]=useState(0.5);
  const [art21,setArt21]=useState(true);
  const [det,setDet]=useState('a');
  const slRef=useRef(null);

  const add=()=>setCos(p=>[...p,{id:uid++,name:`Sociedad ${p.length+1}`,profit:80000,bins:0,isType:'general'}]);
  const rm=id=>setCos(p=>p.filter(c=>c.id!==id));
  const upd=(id,f,v)=>setCos(p=>p.map(c=>c.id===id?{...c,[f]:v}:c));

  useEffect(()=>{if(slRef.current)slRef.current.style.setProperty('--pct',`${wr*100}%`);},[wr]);

  const rA=calcA(cos,wr), rB=calcB(cos,wr,art21), rC=calcC(cos,wr);

  return(
    <div>
    <div className="app">
      {/* LEFT */}
      <div>
        <div className="card">
          <div className="card-title">🏢 Sociedades</div>
          {cos.map(c=>(
            <div key={c.id} className="co">
              <div className="co-hdr">
                <input className="co-name" type="text" value={c.name} placeholder="Nombre" onChange={e=>upd(c.id,'name',e.target.value)}/>
                {cos.length>1&&<button className="btn-rm" onClick={()=>rm(c.id)}>✕ Quitar</button>}
              </div>
              <div className="row2">
                <div className="field"><label>BAI (beneficio antes IS)</label><input type="number" value={c.profit} step="5000" onChange={e=>upd(c.id,'profit',parseFloat(e.target.value)||0)}/></div>
                <div className="field"><label>BINs pendientes</label><input type="number" value={c.bins} step="1000" min="0" onChange={e=>upd(c.id,'bins',Math.max(0,parseFloat(e.target.value)||0))}/></div>
              </div>
              <div className="field">
                <label>Tipo IS aplicable</label>
                <select value={c.isType} onChange={e=>upd(c.id,'isType',e.target.value)}>
                  <option value="general">General — 25%</option>
                  <option value="micropyme">Micropyme (INCN &lt; 1M) — 23%</option>
                  <option value="nueva">Nueva empresa (1.er beneficio) — 15%</option>
                </select>
              </div>
            </div>
          ))}
          {cos.length<7&&<button className="btn-add" onClick={add}>+ Añadir sociedad</button>}
          <p className="note">BAI negativo = la sociedad genera pérdidas/BINs. En consolidación, compensan las bases positivas de otras del grupo.</p>
        </div>

        <div className="card">
          <div className="card-title">⚙️ Configuración</div>
          <div className="field">
            <label>% que extrae el socio (sobre BDI neto)</label>
            <input ref={slRef} type="range" min="0" max="1" step="0.05" value={wr} onChange={e=>setWr(parseFloat(e.target.value))} style={{'--pct':`${wr*100}%`}}/>
            <div className="sl-val">{(wr*100).toFixed(0)}% al socio · {(100-wr*100).toFixed(0)}% queda en sociedad</div>
          </div>
          <hr className="div"/>
          <div className="field">
            <label>Art. 21 LIS (exención holding)</label>
            <div style={{marginTop:'.5rem'}}>
              <div className="tog-wrap">
                <label className="tog">
                  <input type="checkbox" checked={art21} onChange={e=>setArt21(e.target.checked)}/>
                  <span className="tog-track"/>
                </label>
                <span className="tog-lbl" onClick={()=>setArt21(!art21)}>
                  <strong>{art21?'Activo — 95% exento':'Inactivo — sin exención'}</strong>
                  {art21?'Participación ≥5% y período ≥1 año cumplidos':'Holding paga 25% sobre dividendos intragrupo'}
                </span>
              </div>
            </div>
          </div>
          <hr className="div"/>
          <p className="note" style={{lineHeight:1.55}}>
            <strong style={{color:'var(--txtm)'}}>Supuestos:</strong><br/>
            · IRPF: escala estatal 19–28% (sin autonómica).<br/>
            · Consolidación aplica tipo 25% (puede perderse tipo reducido de filiales).<br/>
            · No se modelan precios de transferencia, retenciones, dividendos a cuenta ni normativa autonómica.
          </p>
        </div>

        <div className="card" style={{marginTop:'1rem'}}>
          <div className="card-title">📋 Escala IRPF ahorro</div>
          <div className="tw"><table>
            <thead><tr><th>Tramo</th><th className="nr">Tipo</th></tr></thead>
            <tbody>
              {[{a:'0',b:'6.000 €',r:.19},{a:'6.000',b:'50.000 €',r:.21},{a:'50.000',b:'200.000 €',r:.23},{a:'200.000',b:'300.000 €',r:.27},{a:'300.000',b:'∞',r:.28}].map(t=>(
                <tr key={t.a}><td>{t.a} – {t.b}</td><td className="nr fw7" style={{color:'var(--oral)'}}>{(t.r*100).toFixed(0)}%</td></tr>
              ))}
            </tbody>
          </table></div>
        </div>
      </div>

      {/* RIGHT */}
      <div className="rc">
        {/* Scenario summary cards */}
        <div className="sc-grid">
          <ScCard lbl="Escenario A" ttl="SL Aislada" cls="a" r={rA} isTotal={rA.totalIS}
            note="Base de comparación. Cada sociedad tributa por separado. Dividendo al socio paga IRPF 19–28%."/>
          <ScCard lbl="Escenario B" ttl="Holding (art. 21)" cls="b" r={rB} isTotal={rB.totalISop+rB.hIS}
            note={art21?"IS adicional en holding ~1,25%. Ventaja clave: venta de filiales con plusvalía casi exenta (art. 21).":"Art. 21 inactivo. Actívalo para ver el beneficio de la exención."}/>
          <ScCard lbl="Escenario C" ttl="Consolidación fiscal" cls="c" r={rC} isTotal={rC.gIS}
            note={rC.loff>0?`Compensa ${fmt(rC.loff)} de pérdidas entre entidades del grupo. IS sobre base neta.`:"Sin pérdidas que compensar: la consolidación no aporta ahorro IS en este escenario."}/>
        </div>

        {/* Chart */}
        <div className="chart-box">
          <div className="chart-ttl">▐ Carga fiscal y retención comparada por escenario</div>
          <Chart3 rA={rA} rB={rB} rC={rC}/>
          <div style={{display:'flex',gap:'1rem',marginTop:'.7rem',flexWrap:'wrap'}}>
            {[['var(--bluel)','IS pagado'],['var(--oral)','IRPF del socio'],['var(--grnl)','Retenido en sociedad']].map(([c,l])=>(
              <div key={l} style={{display:'flex',alignItems:'center',gap:'.35rem',fontSize:'.73rem',color:'var(--txtd)'}}>
                <span style={{width:11,height:11,borderRadius:3,background:c,display:'inline-block'}}></span>{l}
              </div>
            ))}
          </div>
        </div>

        {/* Capital gains simulation */}
        <PlusvPanel art21={art21}/>

        {/* Property rental simulation */}
        <InmueblePanel art21={art21}/>

        {/* Detail breakdown */}
        <div className="card">
          <div className="card-title" style={{marginBottom:'.75rem'}}>≡ Desglose detallado por escenario</div>
          <div className="dtabs">
            {[['a','SL Aislada'],['b','Holding (art. 21)'],['c','Consolidación']].map(([id,label])=>(
              <button key={id} className={`dtab ${det===id?id:''}`} onClick={()=>setDet(id)}>{label}</button>
            ))}
          </div>
          <Flow type={det} art21={art21} wr={wr}/>
          {det==='a'&&<DetailA r={rA}/>}
          {det==='b'&&<DetailB r={rB} art21={art21}/>}
          {det==='c'&&<DetailC r={rC}/>}
        </div>

        {/* Reinvestment */}
        {art21&&<ReinvPanel rA={rA} rB={rB}/>}

        {/* Insights */}
        <Insights rA={rA} rB={rB} rC={rC} wr={wr} art21={art21}/>

        {/* Disclaimer */}
        <div style={{padding:'.85rem 1rem',background:'rgba(245,158,11,.06)',border:'1px solid rgba(245,158,11,.18)',borderRadius:'var(--r)',fontSize:'.75rem',color:'var(--txtdim)',lineHeight:1.55}}>
          <strong style={{color:'var(--amb)'}}>⚠️ Aviso legal:</strong> Herramienta exclusivamente informativa/educativa. Los cálculos son simplificaciones del marco tributario español. No constituyen asesoramiento fiscal ni jurídico. Consulta siempre a un asesor fiscal cualificado. No se contemplan precios de transferencia, sustancia económica, reglas antiabuso, normativa autonómica, retenciones ni muchos otros factores relevantes.
        </div>
      </div>
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
